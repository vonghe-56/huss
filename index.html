<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CNnLendar</title>
<style>
:root{--ink:#242936;--muted:#7c8494;--line:#e8eaf0;--paper:#fff;--bg:#f6f7fb;--blue:#5277d8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.app{max-width:1240px;margin:34px auto;padding:0 22px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}
.brand{font-size:27px;font-weight:850;letter-spacing:-1.2px}.brand span{color:var(--blue)}
.header-note{color:var(--muted);font-size:13px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 28px #25345b08}
.calendar{padding:22px}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.month-title{font-size:22px;font-weight:750}
.nav{display:flex;gap:8px}.nav button,.today-btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;color:var(--ink)}
.nav button:hover,.today-btn:hover{background:#f3f5fb}
.weekdays,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}
.weekdays div{text-align:center;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em;padding:8px 0}
.day{min-height:124px;border:1px solid var(--line);border-radius:12px;padding:8px;background:#fff;min-width:0}
.day.other{background:#fafbfc;color:#aeb4c0}.day.today{border:2px solid var(--blue);padding:7px;background:#f8faff}
.day-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;font-size:12px;font-weight:700}
.add-mini{border:0;background:transparent;color:#9aa2b2;font-size:18px;line-height:1;padding:0 3px}.add-mini:hover{color:var(--blue)}
.event{position:relative;border:1px solid transparent;border-left-width:4px;border-radius:7px;padding:5px 27px 5px 7px;margin:4px 0;font-size:11px;line-height:1.3;overflow-wrap:anywhere;cursor:pointer}
.event-type{font-size:9px;font-weight:800;letter-spacing:.06em;margin-bottom:2px}
.event-title{font-weight:650}.event-desc{color:#6f7787;margin-top:3px;font-size:10px}
.event.hw{background:#edf3ff;border-color:#cbd9fb;border-left-color:#6488e5}
.event.practice{background:#fff5df;border-color:#f4dfad;border-left-color:#e6a23c}
.event.project{background:#f3edff;border-color:#ded0fa;border-left-color:#9670d7}
.event.exam{background:#fff0f0;border-color:#f5cccc;border-left-color:#df6b6b}
.event.event-type-card{background:#eaf8f1;border-color:#c8ead8;border-left-color:#48a879}
.event.hw .event-type{color:#4167c1}.event.practice .event-type{color:#a66c13}.event.project .event-type{color:#7953b9}.event.exam .event-type{color:#bd5151}.event.event-type-card .event-type{color:#32845d}
.event.done{opacity:.58}.event.done .event-title{text-decoration:line-through}
.event-check{position:absolute;right:7px;top:7px;width:14px;height:14px;accent-color:#269b64;cursor:pointer}
.event-delete{position:absolute;right:5px;bottom:3px;border:0;background:transparent;color:#9aa2b2;font-size:13px;padding:0 3px}
.sidebar{padding:20px}.side-title{font-size:13px;font-weight:850;letter-spacing:.1em;margin:2px 0 16px}.empty{color:var(--muted);font-size:13px;padding:15px 0}
.upcoming{border-bottom:1px solid var(--line);padding:11px 0}.upcoming:last-child{border:0}.up-date{font-size:10px;color:var(--muted);font-weight:750;text-transform:uppercase;letter-spacing:.06em}.up-title{font-size:13px;font-weight:700;margin:3px 0}.up-tag{font-size:10px;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.legend span{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:5px}.dot{width:8px;height:8px;border-radius:50%}
.modal-backdrop{position:fixed;inset:0;background:#18203370;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.modal-backdrop.show{display:flex}
.modal{width:min(460px,100%);background:#fff;border-radius:18px;padding:23px;box-shadow:0 20px 70px #0003}.modal h2{font-size:20px;margin:0 0 5px}.modal-sub{color:var(--muted);font-size:12px;margin-bottom:18px}
.field{display:block;margin:13px 0}.field span{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;outline:none;background:#fff;color:var(--ink)}.field input:focus,.field textarea:focus,.field select:focus{border-color:#8ba4ec;box-shadow:0 0 0 3px #5277d81a}.field textarea{min-height:75px;resize:vertical}
.modal-actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.right-actions{display:flex;gap:8px}.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:700;font-size:13px}.btn.primary{background:var(--blue);color:#fff}.btn.secondary{background:#f0f2f7;color:var(--ink)}.btn.danger{background:#fff0f0;color:#bd5151}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{order:2}}
@media(max-width:600px){.app{margin:18px auto;padding:0 10px}header{align-items:flex-start;flex-direction:column}.calendar{padding:10px}.weekdays,.days{gap:3px}.day{min-height:90px;padding:4px;border-radius:8px}.day.today{padding:3px}.event{padding:4px 5px;font-size:9px}.event-check{position:static;display:inline-block;width:12px;height:12px;margin:3px 0 0}.event-delete{display:none}.event-type{font-size:8px}.day-top{font-size:10px}.month-title{font-size:18px}.nav button{padding:7px 9px}}

.syncbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:-8px 0 18px;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:14px}
.syncbar input{min-width:0;width:190px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font:inherit;font-size:12px}
.syncbar button{border:0;border-radius:9px;padding:8px 12px;font-size:12px;font-weight:700;background:#edf1fc;color:#3859a7}
.syncbar button.primary{background:var(--blue);color:#fff}.sync-status{font-size:11px;color:var(--muted);flex:1 1 100%}
@media(max-width:600px){.syncbar input{flex:1;width:130px}.syncbar{gap:6px}}
</style>
</head>
<body>
<div class="app">
<header><div class="brand">CNN<span>LENDAR</span></div><div class="header-note">A little space to keep your days in order.</div></header>
<div class="syncbar" id="syncbar">
  <input id="authEmail" type="email" autocomplete="email" placeholder="Email">
  <input id="authPassword" type="password" autocomplete="current-password" placeholder="Password">
  <button class="primary" id="signInBtn" type="button">Log in</button>
  <button id="signUpBtn" type="button">Create account</button>
  <button id="signOutBtn" type="button" hidden>Log out</button>
  <div class="sync-status" id="syncStatus">Not synced yet · Log in with the same account on each device.</div>
</div>
<div class="layout">
<main class="panel calendar">
  <div class="cal-head"><div class="month-title" id="monthTitle"></div><div class="nav"><button id="prev" aria-label="Previous month">‹</button><button class="today-btn" id="todayBtn">Today</button><button id="next" aria-label="Next month">›</button></div></div>
  <div class="weekdays"><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div><div>SUN</div></div>
  <div class="days" id="days"></div>
  <div class="legend">
    <span><i class="dot" style="background:#6488e5"></i>Homework</span><span><i class="dot" style="background:#e6a23c"></i>Practice</span><span><i class="dot" style="background:#9670d7"></i>Project</span><span><i class="dot" style="background:#df6b6b"></i>Exam</span><span><i class="dot" style="background:#48a879"></i>Event</span>
  </div>
</main>
<aside class="panel sidebar"><div class="side-title">NEXT DUE</div><div id="upcoming"></div></aside>
</div>
</div>
<div class="modal-backdrop" id="backdrop">
  <form class="modal" id="itemForm">
    <h2 id="modalTitle">Add an item</h2><div class="modal-sub" id="modalDate"></div>
    <label class="field"><span>Type</span><select id="type"><option value="HW">Homework</option><option value="PRACTICE">Practice</option><option value="PROJECT">Project</option><option value="EXAM">Exam</option><option value="EVENT">Event</option></select></label>
    <label class="field"><span>Title</span><input id="title" maxlength="100" required placeholder="What do you need to do?"></label>
    <label class="field"><span>Description (optional)</span><textarea id="description" maxlength="500" placeholder="Add a few details..."></textarea></label>
    <div class="modal-actions"><button type="button" class="btn danger" id="deleteBtn" hidden>Delete</button><div class="right-actions"><button type="button" class="btn secondary" id="cancelBtn">Cancel</button><button type="submit" class="btn primary">Save</button></div></div>
  </form>
</div>
<script>
(()=> {
'use strict';
const STORE='cnnlendar-items-v2';
const SUPABASE_URL='https://dhzgrxubwynbpdyxcduj.supabase.co';
const SUPABASE_KEY='sb_publishable_32i9APU531HVGJFpFzwNig_OXww1QHO';
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null, realtimeChannel=null, applyingRemote=false;
const typeNames={HW:'HOMEWORK',PRACTICE:'PRACTICE',PROJECT:'PROJECT',EXAM:'EXAM',EVENT:'EVENT'};
const classNames={HW:'hw',PRACTICE:'practice',PROJECT:'project',EXAM:'exam',EVENT:'event-type-card'};
const checkable=new Set(['HW','PRACTICE','PROJECT']);
let items=loadItems(), view=new Date(), selectedDate='', editingId=null;
const $=id=>document.getElementById(id);
function loadItems(){try{const v=JSON.parse(localStorage.getItem(STORE)||'{}');return v&&typeof v==='object'?v:{}}catch(e){return {}}}
function save(){localStorage.setItem(STORE,JSON.stringify(items));render();if(currentUser&&!applyingRemote)pushCloud()}
function setStatus(message){$('syncStatus').textContent=message}
async function pushCloud(){
 try{setStatus('Saving to your account…');const {error}=await supabase.from('user_calendars').upsert({user_id:currentUser.id,data:items,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)throw error;setStatus('Synced · Your calendar is saved to the cloud.')}
 catch(e){setStatus('Sync error: '+e.message+' · Check the Supabase table setup.')}
}
async function syncCloud(user){
 currentUser=user;
 $('authEmail').hidden=true;$('authPassword').hidden=true;$('signInBtn').hidden=true;$('signUpBtn').hidden=true;$('signOutBtn').hidden=false;
 setStatus('Loading your calendar…');
 try{
  const {data,error}=await supabase.from('user_calendars').select('data').eq('user_id',user.id).maybeSingle();
  if(error)throw error;
  if(data&&data.data&&typeof data.data==='object'){applyingRemote=true;items=data.data;localStorage.setItem(STORE,JSON.stringify(items));applyingRemote=false;render();setStatus('Synced · Signed in as '+user.email)}
  else {await pushCloud();setStatus('Your existing calendar has been copied to the cloud.')}
  if(realtimeChannel)await supabase.removeChannel(realtimeChannel);
  realtimeChannel=supabase.channel('calendar-'+user.id).on('postgres_changes',{event:'UPDATE',schema:'public',table:'user_calendars',filter:'user_id=eq.'+user.id},payload=>{
   if(payload.new&&payload.new.data){applyingRemote=true;items=payload.new.data;localStorage.setItem(STORE,JSON.stringify(items));render();applyingRemote=false;setStatus('Synced · Updated from another device')}
  }).subscribe();
 }catch(e){applyingRemote=false;setStatus('Could not sync: '+e.message)}
}
$('signInBtn').addEventListener('click',async()=>{const email=$('authEmail').value.trim(),password=$('authPassword').value;if(!email||!password){setStatus('Enter your email and password first.');return}setStatus('Logging in…');const {data,error}=await supabase.auth.signInWithPassword({email,password});if(error){setStatus(error.message);return}await syncCloud(data.user)});
$('signUpBtn').addEventListener('click',async()=>{const email=$('authEmail').value.trim(),password=$('authPassword').value;if(!email||password.length<6){setStatus('Enter an email and a password with at least 6 characters.');return}setStatus('Creating your account…');const {data,error}=await supabase.auth.signUp({email,password});if(error){setStatus(error.message);return}if(data.session)await syncCloud(data.user);else setStatus('Account created. Check your email to confirm, then log in here.')});
$('signOutBtn').addEventListener('click',async()=>{await supabase.auth.signOut();if(realtimeChannel)await supabase.removeChannel(realtimeChannel);currentUser=null;$('authEmail').hidden=false;$('authPassword').hidden=false;$('signInBtn').hidden=false;$('signUpBtn').hidden=false;$('signOutBtn').hidden=true;setStatus('Logged out · This device still has its local copy.')});
supabase.auth.getSession().then(({data})=>{if(data.session)syncCloud(data.session.user)});
function pad(n){return String(n).padStart(2,'0')}
function key(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function dateFromKey(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function escapeText(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){
 const year=view.getFullYear(),month=view.getMonth(),first=new Date(year,month,1),start=(first.getDay()+6)%7;
 $('monthTitle').textContent=first.toLocaleDateString(undefined,{month:'long',year:'numeric'});
 const today=key(new Date()),gridStart=new Date(year,month,1-start),days=$('days');days.innerHTML='';
 for(let i=0;i<42;i++){
  const d=new Date(gridStart);d.setDate(gridStart.getDate()+i);const k=key(d),cell=document.createElement('section');
  cell.className='day'+(d.getMonth()!==month?' other':'')+(k===today?' today':'');
  const top=document.createElement('div');top.className='day-top';top.innerHTML=`<span>${d.getDate()}</span>`;
  const add=document.createElement('button');add.className='add-mini';add.type='button';add.textContent='+';add.title='Add item';add.addEventListener('click',()=>openModal(k));top.append(add);cell.append(top);
  (items[k]||[]).forEach(item=>{
   const card=document.createElement('div');card.className=`event ${classNames[item.type]||'hw'}${item.completed?' done':''}`;
   const type=document.createElement('div');type.className='event-type';type.textContent=typeNames[item.type]||'HOMEWORK';
   const title=document.createElement('div');title.className='event-title';title.textContent=item.title;
   card.append(type,title);
   if(checkable.has(item.type)){const check=document.createElement('input');check.type='checkbox';check.className='event-check';check.checked=!!item.completed;check.title=item.completed?'Completed':'Mark complete';check.setAttribute('aria-label','Mark '+item.title+' complete');check.addEventListener('click',e=>e.stopPropagation());check.addEventListener('change',()=>{item.completed=check.checked;save()});card.append(check)}
   if(item.description){const desc=document.createElement('div');desc.className='event-desc';desc.textContent=item.description;card.append(desc)}
   const del=document.createElement('button');del.type='button';del.className='event-delete';del.textContent='×';del.title='Delete';del.addEventListener('click',e=>{e.stopPropagation();if(confirm('Delete this item?'))removeItem(k,item.id)});card.addEventListener('click',()=>openModal(k,item));card.append(del);cell.append(card);
  });
  cell.addEventListener('dblclick',e=>{if(e.target===cell||e.target===top||e.target===top.firstChild)openModal(k)});days.append(cell);
 }
 renderUpcoming(today);
}
function renderUpcoming(today){
 const all=Object.entries(items).flatMap(([date,list])=>list.filter(x=>!x.completed).map(x=>({...x,date}))).filter(x=>x.date>=today).sort((a,b)=>a.date.localeCompare(b.date));
 const box=$('upcoming');box.innerHTML='';
 if(!all.length){box.innerHTML='<div class="empty">Nothing coming up. Enjoy the breathing room ✨</div>';return}
 all.slice(0,8).forEach(x=>{const row=document.createElement('div');row.className='upcoming';const date=document.createElement('div');date.className='up-date';date.textContent=dateFromKey(x.date).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});const title=document.createElement('div');title.className='up-title';title.textContent=x.title;const tag=document.createElement('div');tag.className='up-tag';tag.textContent=typeNames[x.type]||'HOMEWORK';row.append(date,title,tag);row.addEventListener('click',()=>{view=dateFromKey(x.date);render();openModal(x.date,x)});box.append(row)});
}
function openModal(date,item=null){
 selectedDate=date;editingId=item?item.id:null;$('modalTitle').textContent=item?'Edit item':'Add an item';$('modalDate').textContent=dateFromKey(date).toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 $('type').value=item?.type||'HW';$('title').value=item?.title||'';$('description').value=item?.description||'';$('deleteBtn').hidden=!item;$('backdrop').classList.add('show');$('title').focus();
}
function closeModal(){$('backdrop').classList.remove('show');$('itemForm').reset();editingId=null}
function removeItem(date,id){items[date]=(items[date]||[]).filter(x=>x.id!==id);if(!items[date].length)delete items[date];save();closeModal()}
$('itemForm').addEventListener('submit',e=>{e.preventDefault();const title=$('title').value.trim();if(!title)return;const list=items[selectedDate]||[];if(editingId){const item=list.find(x=>x.id===editingId);if(item){item.type=$('type').value;item.title=title;item.description=$('description').value.trim()}}else{list.push({id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()),type:$('type').value,title,description:$('description').value.trim(),completed:false});items[selectedDate]=list}save();closeModal()});
$('deleteBtn').addEventListener('click',()=>{if(editingId&&confirm('Delete this item?'))removeItem(selectedDate,editingId)});
$('cancelBtn').addEventListener('click',closeModal);$('backdrop').addEventListener('click',e=>{if(e.target===$('backdrop'))closeModal()});
$('prev').addEventListener('click',()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()});
$('next').addEventListener('click',()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()});
$('todayBtn').addEventListener('click',()=>{view=new Date();render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();
})();
</script>
</body>
</html>
